name: Update native xxHash binaries

# Rebuilds Native/xxhash.dll and Native/libxxhash.so from the external/xxHash submodule,
# runs the managed-vs-native unit tests against the fresh binaries, and opens a PR with them.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - external/xxHash
      - .github/workflows/native-binaries.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            built: build/Release/xxhash.dll
            target: xxhash.dll
          - os: ubuntu-latest
            built: build/libxxhash.so
            target: libxxhash.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build xxHash shared library
        shell: bash
        run: |
          # DISPATCH adds xxh_x86dispatch.c: the XXH3_*_dispatch exports pick
          # AVX-512 / AVX2 / SSE2 at runtime, so the binary is safe on any x64 CPU.
          # xxh_x86dispatch.c doesn't include its own header, so MSVC never marks the
          # dispatch functions dllexport; export them explicitly via the linker.
          # (GCC exports them anyway thanks to default symbol visibility.)
          LINKER_FLAGS=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Pin the baseline ISA. Dispatch only works if everything outside the
            # *_avx2 / *_avx512 variants is plain SSE2; a toolchain whose default -march
            # enables AVX would make the "SSE2" path and the dispatcher itself crash on
            # older CPUs. The previous build had exactly that problem.
            export CFLAGS="-march=x86-64 -mtune=generic"   # CMake seeds CMAKE_C_FLAGS from this
            gcc -Q --help=target | grep -E '^\s+-march=|^\s+-mavx2 ' || true
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            for f in XXH_featureTest \
                     XXH3_64bits_dispatch XXH3_64bits_withSeed_dispatch XXH3_64bits_withSecret_dispatch XXH3_64bits_update_dispatch \
                     XXH3_128bits_dispatch XXH3_128bits_withSeed_dispatch XXH3_128bits_withSecret_dispatch XXH3_128bits_update_dispatch; do
              LINKER_FLAGS="$LINKER_FLAGS -EXPORT:$f"   # '-' instead of '/' avoids MSYS path conversion
            done
          fi
          cmake -S external/xxHash/build/cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DXXHASH_BUILD_XXHSUM=OFF \
            -DDISPATCH=ON \
            "-DCMAKE_SHARED_LINKER_FLAGS=$LINKER_FLAGS"
          cmake --build build --config Release
          # On Linux libxxhash.so is a symlink chain; -L copies the real file.
          cp -L "${{ matrix.built }}" "Native/${{ matrix.target }}"

      - name: Verify ISA usage (no AVX outside *_avx2 / *_avx512 functions)
        if: runner.os == 'Linux'
        run: |
          objdump -d --no-show-raw-insn Native/libxxhash.so | awk '
            /^[0-9a-f]+ <.*>:$/ { fn = $2; next }
            fn !~ /avx2|avx512/ && $0 ~ /\t(v[a-z0-9]+)[ \t]/ { bad[fn]++ }
            fn ~ /avx2/   && $0 ~ /%ymm/ { avx2++ }
            fn ~ /avx512/ && $0 ~ /%zmm/ { avx512++ }
            END {
              for (f in bad) { print "AVX instruction in non-AVX function " f ": " bad[f]; fail = 1 }
              printf "AVX2 ymm instructions: %d, AVX-512 zmm instructions: %d\n", avx2, avx512
              if (!avx2 || !avx512) { print "missing AVX2/AVX-512 variants"; fail = 1 }
              exit fail
            }'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Test managed vs native
        run: dotnet test UnitTests -c Release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: Native/${{ matrix.target }}
          if-no-files-found: error

  pull-request:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          path: Native
          merge-multiple: true

      - name: Read xxHash version
        id: version
        run: |
          # checkout fetches the submodule without tags
          git -C external/xxHash fetch --depth=1 origin "+refs/tags/*:refs/tags/*"
          echo "tag=$(git -C external/xxHash describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-native-binaries
          add-paths: |
            Native/xxhash.dll
            Native/libxxhash.so
          commit-message: Update native xxHash binaries to ${{ steps.version.outputs.tag }}
          title: Update native xxHash binaries to ${{ steps.version.outputs.tag }}
          body: |
            Rebuilt `Native/xxhash.dll` (windows-x64) and `Native/libxxhash.so` (linux-x64) from the
            `external/xxHash` submodule at `${{ steps.version.outputs.tag }}`. Managed-vs-native unit
            tests passed on both platforms against these binaries.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
